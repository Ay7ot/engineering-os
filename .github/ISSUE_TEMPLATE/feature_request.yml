name: Feature request
description: Suggest an improvement to the engine.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today? Describe the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, and why you rejected them.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - CLI (scripts/eng)
        - Memory MCP server
        - Agents / skills / commands
        - Documentation
        - Repo / CI
        - Other
    validations:
      required: true
