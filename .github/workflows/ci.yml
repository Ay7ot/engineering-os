name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Syntax check (bash)
        run: bash -n scripts/eng

      - name: Syntax check (python)
        run: python3 -m py_compile mcp/engineering-memory/server.py

      - name: Script tests
        run: bash tests/test_eng.sh

      - name: MCP tests
        run: bash tests/test_mcp.sh

      - name: Ruleset config guard
        run: python3 tests/test_ruleset.py
